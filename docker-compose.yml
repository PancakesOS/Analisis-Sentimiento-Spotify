name: pulso                 # Nombre fijo del proyecto: los volúmenes se llaman igual sin importar la carpeta del clon

x-postgres-env: &postgres-env                 # Variables de conexión que comparten los servicios de Python
  POSTGRES_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  TZ: America/Mexico_City

services:
  postgres:                 # La base: control, modelo estrella y (después) las vistas de las preguntas
    image: postgres:18
    environment:            # Usuario, contraseña y base a crear, tomados del .env (si falta uno, compose se detiene con el mensaje)
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env (copia .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (copia .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env (copia .env.example)}
      TZ: America/Mexico_City                 # Las fechas con zona se muestran en hora de México
      PGTZ: America/Mexico_City
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro   # 01_control.sql y 02_star.sql: solo corren con el volumen vacío
      - pgdata:/var/lib/postgresql            # Los datos sobreviven a docker compose down (sin -v)
    # Sin "ports": nada fuera de Docker necesita la base, y así no choca con
    # otro PostgreSQL en el puerto 5432. Para consultarla:
    #   docker compose exec postgres psql -U admin -d pulso
    healthcheck:            # Lista cuando acepta conexiones por TCP (durante la inicialización solo escucha por socket)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka:                    # Broker de Kafka en modo KRaft (sin ZooKeeper). Sin "ports": solo lo usan otros contenedores
    image: apache/kafka:4.1.0
    environment:            # Un broker que trabaja solo; misma configuración que en la Tarea 4
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data     # Los mensajes van al volumen: sobreviven si se recrea el contenedor
      KAFKA_LOG_RETENTION_HOURS: 168          # 7 días, menos que el límite de 30 días para el texto de comentarios
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:            # Listo cuando responde a los clientes en el puerto 9092
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  batch:                    # cron: chart_loader, video_finder, stats_snapshot y retention
    build: .
    command: ["sh", "/app/ingestion/entrypoint_batch.sh"]
    init: true              # Un init mínimo como PID 1: el contenedor se detiene de inmediato con docker compose stop
    environment:
      <<: *postgres-env
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?Falta YOUTUBE_API_KEY en .env (copia .env.example)}
    volumes:
      - ./data/landing:/app/data/landing:ro   # Carpeta de entrada: los CSV del chart que descargo a mano (solo lectura)
      - raw:/app/data/raw                     # Zona cruda: copias de los archivos tal como llegaron
      - state:/app/data/state                 # Candados y checkpoints de los trabajos
      - ./logs:/app/logs                      # Un .log por trabajo, visible desde la Mac
    depends_on:
      postgres:
        condition: service_healthy            # Espera a que el esquema exista antes de la primera carga
    restart: unless-stopped

  comments_producer:        # Poller de comentarios: cada hora publica los nuevos en Kafka
    build: .
    command: ["/app/.venv/bin/python", "-m", "ingestion.comments_producer"]
    init: true
    environment:
      <<: *postgres-env
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: youtube_comments
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  consumer:                 # Lee youtube_comments y escribe raw/comments/AAAA-MM-DD.log
    build: .
    command: ["/app/.venv/bin/python", "-m", "ingestion.consumer"]
    init: true
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: youtube_comments
      TZ: America/Mexico_City
    volumes:
      - raw:/app/data/raw                     # El mismo crudo que ve el contenedor batch
      - ./logs:/app/logs
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:                    # Docker los conserva hasta docker compose down -v
  pgdata:
  kafkadata:
  raw:
  state:
